spring.application.name=evmpas-w4

# ---- Default profile: H2 in-memory (works out of the box, no setup needed) ----
spring.datasource.url=jdbc:h2:mem:evmpasdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# ---- JWT ----
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTSigningThatMustBeAtLeast256BitsLong123456
app.jwt.expiration-ms=86400000

# ---- Logging ----
logging.level.com.company.enterprise=INFO
logging.level.org.springframework.security=INFO

springdoc.swagger-ui.path=/swagger-ui.html
